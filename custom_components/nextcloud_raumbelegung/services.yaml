kalibrierlauf:
  fields:
    raeume:
      required: true
      example: '["Saal"]'
      selector:
        text:
          multiple: true
    zieltemperatur:
      example: 21
      selector:
        number:
          min: 15
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
    andere_raeume:
      example: 10
      selector:
        number:
          min: 5
          max: 20
          step: 0.5
          unit_of_measurement: "°C"
    hoechstens_stunden:
      example: 6
      selector:
        number:
          min: 1
          max: 12
          step: 0.5
          unit_of_measurement: h
kalibrierlauf_abbrechen:
aus_historie_lernen:
offset_nachtragen:
  fields:
    raum:
      required: true
      example: "Nebenraum (groß)"
      selector:
        text:
    verlauf:
      required: true
      example: '[{"ab": "2026-11-01 00:00", "offset": 0}, {"ab": "2026-11-22 11:44", "offset": -1.5}]'
      selector:
        object:
